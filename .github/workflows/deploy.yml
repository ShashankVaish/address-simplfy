name: deploy

# `sam deploy` on main, then the smoke test. A bad deploy is caught here, not
# by a judge. Needs AWS_ROLE_ARN (an OIDC deploy role) in repository secrets.
on:
  push:
    branches: [main]
    paths: [backend/**]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Build the gazetteer for the layer
        run: |
          pip install -r requirements-dev.txt
          curl -sL --max-time 300 -o data/pincode_raw.csv \
            https://raw.githubusercontent.com/harshvardhaniimi/IndiaPIN/main/data-raw/pincode.csv
          python -m scripts.build_gazetteer --src data/pincode_raw.csv
          python -m scripts.prepare_layer

      - name: Deploy
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name patasetu --resolve-s3 --capabilities CAPABILITY_IAM \
            --parameter-overrides "ServingStack=${{ vars.SERVING_STACK || 'A' }}"

      - name: Smoke test
        run: ./scripts/smoke.sh
